  - "root runtime marty-common pin"
  - "marty-common immutable tag publication workflow"
  - "previous marty-common 0.2.10 release changes and failed publication log"
  - "marty-msf immutable GitHub release publication and verification"
candidate_implementations:
  - path: packages/marty-common/pyproject.toml
    language: TOML
    disposition: update_existing_package_version
  - path: packages/marty-common/marty_common/__init__.py
    language: Python
    disposition: update_existing_runtime_version
  - path: pyproject.toml
    language: TOML
    disposition: align_existing_root_runtime_pin
  - path: .github/workflows/publish-pypi.yml
    language: YAML
    disposition: adapt_existing_marty_msf_immutable_publication_workflow
no_match_statement: ""
decision: adapt_existing
canonical_implementation:
  path: packages/marty-common
  language: Python
rust_disposition: rust_not_applicable
non_rust_rationale: >-
  This task changes release metadata and publication safeguards only. The
  released authorization behavior already resides in the merged Python HTTP
  middleware. The workflow retains the proven marty-msf post-publication
  immutability and digest checks while omitting a repository-settings read that
  the GitHub Actions token cannot authorize. No new protocol, cryptographic,
  validation, or portable domain logic is added.
