version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "10:00"
      timezone: "America/Denver"
    groups:
      pip-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      pip-major-dependencies:
        patterns: ["*"]
        update-types: [major]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "11:00"
      timezone: "America/Denver"
    groups:
      github-actions-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
