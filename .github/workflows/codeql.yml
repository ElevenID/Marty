name: CodeQL

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    uses: ElevenID/.github/.github/workflows/codeql.yml@9b6141e294da5c0f9254cfaa60c8934df95ec68b
    with:
      languages: '["python"]'
    permissions:
      contents: read
      security-events: write
      packages: read
