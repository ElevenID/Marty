name: Publish marty-common

on:
  push:
    tags: ["marty-common-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate version
        working-directory: packages/marty-common
        run: |
          expected="${GITHUB_REF_NAME#marty-common-v}"
          actual="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$actual" = "$expected"
      - run: python -m pip install build && python -m build packages/marty-common
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marty-common-python
          path: packages/marty-common/dist/*
          retention-days: 7

  publish:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marty-common-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marty-common-python
          path: release
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: packages/marty-common
          format: cyclonedx-json
          output-file: release/marty-common-sbom.cdx.json
      - name: Generate checksums
        working-directory: release
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/**/*
      - name: Publish the immutable release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          immutable_settings="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases")"
          jq -e '.enabled == true' <<<"$immutable_settings" >/dev/null

          tag_object="$(git rev-parse "refs/tags/$TAG")"
          remote_object="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$remote_object" = "$tag_object"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; it will not be changed"
            exit 1
          fi

          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "marty-common $TAG"

          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release.json
          jq -e '.draft == false and .prerelease == false and .immutable == true' \
            published-release.json >/dev/null
          for file in release/*; do
            name="$(basename "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            jq -e --arg name "$name" --arg digest "$digest" \
              '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' \
              published-release.json >/dev/null
          done
