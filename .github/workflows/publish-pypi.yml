name: Publish marty-common

on:
  push:
    tags: ["marty-common-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate version
        working-directory: packages/marty-common
        run: |
          expected="${GITHUB_REF_NAME#marty-common-v}"
          actual="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$actual" = "$expected"
      - run: python -m pip install build && python -m build packages/marty-common
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marty-common-python
          path: packages/marty-common/dist/*
          retention-days: 7

  publish:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marty-common-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marty-common-python
          path: release
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: packages/marty-common
          format: cyclonedx-json
          output-file: release/marty-common-sbom.cdx.json
      - name: Generate checksums
        working-directory: release
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/**/*
      - name: Publish the immutable release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_object="$(git rev-parse "refs/tags/$TAG")"
          remote_object="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$remote_object" = "$tag_object"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; it will not be changed"
            exit 1
          fi

          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "marty-common $TAG"

          # GITHUB_TOKEN cannot read repository immutable-release settings, so
          # the published release response is the authoritative workflow check.
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release.json
          jq -e '.draft == false and .prerelease == false and .immutable == true' \
            published-release.json >/dev/null
          for file in release/*; do
            name="$(basename "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            jq -e --arg name "$name" --arg digest "$digest" \
              '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' \
              published-release.json >/dev/null
          done
