name: Protocol validation

on:
  pull_request:
    paths: ["proto/**", "src/compile_protos.py", "src/proto/**", "src/marty_plugin/proto/**", "tests/unit/test_proto_compatibility.py", "pyproject.toml", ".github/workflows/proto-validation.yml"]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install grpcio-tools==1.76.0 protobuf==6.31.1 grpcio==1.76.0 pytest==8.4.2 pytest-asyncio==1.2.0
      - name: Verify canonical generation and compatibility imports
        run: |
          python src/compile_protos.py
          git diff --exit-code -- src/marty_plugin/proto/v1 src/proto/v1
          python -m pytest --noconftest tests/unit/test_proto_compatibility.py -q
      - name: Verify wheel compatibility namespaces
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/marty-wheel .
          cd /tmp
          python - <<'PY'
          import glob
          import importlib
          import pickle
          import sys
          sys.path.insert(0, glob.glob('/tmp/marty-wheel/*.whl')[0])
          old = importlib.import_module('proto.v1.dtc_engine_pb2')
          current = importlib.import_module('marty_plugin.proto.v1.dtc_engine_pb2')
          assert old is current
          message = old.CreateDTCRequest(passport_number='wheel')
          assert pickle.loads(pickle.dumps(message)) == message
          PY
      - name: Compile all public protocol definitions
        shell: bash
        run: |
          mkdir -p /tmp/marty-proto
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=/tmp/marty-proto \
            --grpc_python_out=/tmp/marty-proto \
            proto/*.proto
          test -n "$(find /tmp/marty-proto -type f -name '*_pb2.py' -print -quit)"
