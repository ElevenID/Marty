name: Warm CI Caches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/warm-ci-caches.yml
      - pyproject.toml
      - packages/marty-common/**
      - src/**
      - proto/**
      - docker/mmf-plugin.Dockerfile
      - scripts/build-native-wheels.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

env:
  MARTY_CORE_REVISION: 359df1d20f152e21783fe43078d753fa1b494ce4

jobs:
  image:
    name: Warm image cache
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore exact pinned native wheels
        id: native-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native-wheels
          key: native-wheels-v1-${{ runner.os }}-${{ runner.arch }}-py311-rust1971-maturin1141-${{ env.MARTY_CORE_REVISION }}-${{ hashFiles('scripts/build-native-wheels.sh') }}
      - if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-core
          ref: ${{ env.MARTY_CORE_REVISION }}
          path: marty-core
          persist-credentials: false
      - if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Install native transport build dependencies
        if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev libdbus-1-dev pkg-config
      - name: Build exact pinned native wheels
        if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        run: bash scripts/build-native-wheels.sh
      - name: Require exact pinned native wheel set
        shell: bash
        run: |
          test "$(find native-wheels -maxdepth 1 -name 'marty_rs-*.whl' | wc -l)" -eq 1
          test "$(find native-wheels -maxdepth 1 -name 'marty_verification_py-*.whl' | wc -l)" -eq 1
          test "$(find native-wheels -maxdepth 1 -name 'marty_iso18013-*.whl' | wc -l)" -eq 1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Warm canonical image layers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/mmf-plugin.Dockerfile
          target: production
          push: false
          build-args: |
            VERSION=cache-warm
            VCS_REF=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=marty-ci-image
          cache-to: type=gha,mode=max,scope=marty-ci-image
