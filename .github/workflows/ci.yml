name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Check all maintained Python sources and scripts
        run: uv run --no-project --python 3.11 python scripts/security_scan.py code --ephemeral
      - name: Prove findings and incomplete scans fail locally and in CI
        run: uv run --no-project --python 3.11 --with pytest==8.4.2 --with pytest-asyncio==1.2.0 --with PyYAML==6.0.3 --with pre-commit==4.3.0 python -m pytest tests/unit/bandit_gate_test.py -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install maintained infrastructure and source tooling
        run: python -m pip install "./packages/marty-common[test]" pytest==8.4.2 pytest-asyncio==1.2.0 build twine
      - name: Compile and test maintained sources
        run: |
          python -m compileall -q src packages/marty-common/marty_common scripts
          python -m pytest tests/unit packages/marty-common/tests -q
      - name: Verify common package metadata
        run: |
          python -m build packages/marty-common
          python -m twine check packages/marty-common/dist/*
      - name: Exercise installed common wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/marty-common-wheel"
          "$RUNNER_TEMP/marty-common-wheel/bin/python" -m pip install packages/marty-common/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/marty-common-wheel/bin/python" -I "$GITHUB_WORKSPACE/tests/probes/common_wheel_smoke.py" --installed-wheel

  ci-gate:
    name: CI Gate
    if: always()
    needs: [test, bandit]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Require every CI lane
        shell: bash
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
      - name: Summarize CI performance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: context.runId});
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const created = new Date(run.created_at);
            const rows = data.jobs.filter(job => job.started_at && job.completed_at).map(job => ({
              name: job.name,
              queue: Math.max(0, Math.round((new Date(job.started_at) - created) / 1000)),
              run: Math.max(0, Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 1000)),
            })).sort((a, b) => b.run - a.run);
            const maxQueue = Math.max(0, ...rows.map(row => row.queue));
            core.summary.addHeading('CI performance').addTable([
              [{data: 'Longest jobs', header: true}, {data: 'Queue', header: true}, {data: 'Runtime', header: true}],
              ...rows.slice(0, 10).map(row => [row.name, `${row.queue}s`, `${row.run}s`]),
            ]).addRaw(`Longest observed queue delay: ${maxQueue}s.`);
            if (maxQueue > 300) core.warning(`Runner queue delay reached ${maxQueue}s.`);
            await core.summary.write();
