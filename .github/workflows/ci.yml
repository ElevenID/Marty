name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MARTY_CORE_REVISION: c8a028e803e7278f7842f5085855ac12a80b14ba

jobs:
  build-native-wheels:
    name: Build pinned native wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore exact pinned native wheels
        id: native-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native-wheels
          key: native-wheels-v1-${{ runner.os }}-${{ runner.arch }}-py311-rust1971-maturin1141-${{ env.MARTY_CORE_REVISION }}-${{ hashFiles('scripts/build-native-wheels.sh') }}
      - if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-core
          ref: ${{ env.MARTY_CORE_REVISION }}
          path: marty-core
      - if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Install native transport build dependencies
        if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev libdbus-1-dev pkg-config
      - name: Build exact pinned native wheels
        if: ${{ steps.native-wheel-cache.outputs.cache-hit != 'true' }}
        run: bash scripts/build-native-wheels.sh
      - name: Require exact pinned native wheel set
        shell: bash
        run: |
          test "$(find native-wheels -maxdepth 1 -name 'marty_rs-*.whl' | wc -l)" -eq 1
          test "$(find native-wheels -maxdepth 1 -name 'marty_verification_py-*.whl' | wc -l)" -eq 1
          test "$(find native-wheels -maxdepth 1 -name 'marty_iso18013-*.whl' | wc -l)" -eq 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marty-native-linux
          path: native-wheels/*.whl
          if-no-files-found: error
          retention-days: 2

  test:
    needs: build-native-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install smart-card build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: marty-native-linux
          path: native-wheels
      - name: Install from released dependencies
        run: |
          python -m pip install native-wheels/*.whl
          python -m pip install --find-links native-wheels packages/marty-common .
      - name: Verify required native backends
        run: python -c "from marty_plugin.native_backends import require_native_backends; require_native_backends()"
      - name: Compile and test
        run: |
          python -m compileall -q src
          python -m pytest packages/marty-common/tests tests/unit -q
      - name: Verify package metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  image:
    needs: build-native-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: marty-native-linux
          path: native-wheels
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/mmf-plugin.Dockerfile
          target: production
          push: false
          tags: marty:ci
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=marty-ci-image
          cache-to: type=gha,mode=max,scope=marty-ci-image
